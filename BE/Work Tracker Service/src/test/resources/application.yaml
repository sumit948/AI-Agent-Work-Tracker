spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  main:
    web-application-type: servlet
application:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-256-bits-in-tests-only
    expiration: 86400000
  ai:
    openai:
      api-key: test-key
      model: gpt-3.5-turbo
      base-url: https://api.openai.com/v1
      timeout-seconds: 10
  cors:
    allowed-origins: http://localhost:3000
